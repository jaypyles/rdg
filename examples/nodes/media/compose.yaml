services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    volumes:
      - ${JELLYFIN_CONFIG:-/home/jayden/volumes/jellyfin/config}:/config
      - ${NAS_MOVIES:-/mnt/media/media/movies}:/data/Movies
      - ${NAS_TV:-/mnt/media/media/tv}:/data/TV
    devices:
      - /dev/dri:/dev/dri
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    group_add:
      - "video"
    networks:
      - webservice-network

  jellyseerr:
    init: true
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - TZ=America/New_York
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - /home/jayden/volumes/jellyseer/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - webservice-network

networks:
  webservice-network:
    external: true
    name: webservice-network
